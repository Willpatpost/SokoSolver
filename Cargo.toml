[workspace]
resolver = "2"
members = [
    "crates/sokomind-core",
    "crates/sokomind-solver",
    "crates/sokomind-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
sokomind-core = { path = "crates/sokomind-core" }
sokomind-solver = { path = "crates/sokomind-solver" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustc-hash = "2"
web-time = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
