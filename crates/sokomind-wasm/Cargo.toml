[package]
name = "sokomind-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebAssembly bridge for the Sokomind solver"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sokomind-core = { workspace = true }
sokomind-solver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

